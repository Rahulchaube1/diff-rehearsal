name: Test workbook generator
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/build_demo.py "$RUNNER_TEMP/rehearsal.html"
      - run: cmp examples/rehearsal.html "$RUNNER_TEMP/rehearsal.html"
